<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            margin: 0px;
            padding: 20px;
        }

        .container{
            max-width: 1200px;
            margin: 0 auto;
        }

        h1{
            text-align: center;
        }

        .controls{
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px;
        }

        input,select{
            padding: 10px;
        }

        #count{
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        #search{
            display: block;
            margin: 20px auto;
            padding: 10px;
            width: 300px;
        }

        #products{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card{
            width: 250px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 5px gray;
        }

        .card img{
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        button{
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Fake Store API</h2>

<div class="controls">

<input type="text" id="search" placeholder="Search Product">

<select id="category">

<option value="all">All Categories</option>
<option value="electronics">Electronics</option>
<option value="jewelery">Jewelery</option>
<option value="men's clothing">Men's Clothing</option>
<option value="women's clothing">Women's clothing</option>

</select>

<select id="price">

<option value="all">All Prices</option>
<option value="50">Below $50</option>
<option value="100">Below $100</option>
<option value="200">Below $200</option>

</select>

</div>

<div id="count"></div>

<div id="products"></div>

<script src="task8.js"></script>
    
</body>
</html>
